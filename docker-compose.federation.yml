version: '3.9'

services:

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/liceu
    ports:
      - "7687:7687"
      - "7474:7474"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686"
